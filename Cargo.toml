# The workspace of the client-tauri repository. Every crate under crates/ is a
# member; add a crate by adding its directory.
[workspace]
# The resolver of edition 2024, the monorepo's, so a crate resolves the same
# features and the same MSRV-aware versions on both sides of an extraction.
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/TheClockwyrks/client-tauri"
# A crate of The Test Cabinet is consumed by its git source, never from
# crates.io, so none is published; a member says `publish.workspace = true`, and
# Cargo refuses that key when the root holds none to inherit.
publish = false

# Warnings-as-errors, baked into the manifests for every member crate that
# opts in with `[lints] workspace = true`, so a plain `cargo build` enforces
# the policy the clippy gate enforces on the command line.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

# The crates of the other repositories this one may depend on, each at its
# public source, the GitHub mirror, and the tag its dependents pin. The
# superrepo's .cargo/config.toml redirects every one of these to the sibling
# checkout, so a build inside the superrepo never fetches them. A manifest
# never names an Azure URL or a path outside the repository: the
# dependency-edges gate refuses both.
[workspace.dependencies]
# client-tauri depends on no crate of another repository.

# The public crates the shell builds with. A member names each without a
# version and the workspace decides the one it builds with. `tauri` and
# `tauri-build` are two halves of one release: the second reads
# `tauri.conf.json` at build time and generates what the first's
# `generate_context!` embeds, so the two move together, with the plugins and
# the `@tauri-apps/cli` devDependency of the root package.json.
getrandom = "0.4.3"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.2"
tempfile = "3.27.0"
url = "2.5.8"
